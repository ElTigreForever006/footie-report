name: Build & deploy headlines

on:
  schedule:
    # Not */30: that fires at :00 and :30, two of the busiest minutes on GitHub,
    # where scheduled runs get queued behind everyone else's and dropped. Odd
    # minutes are far less contended. Scheduled runs are best-effort either way,
    # so the page shows its real build time rather than a promise.
    #
    # Down from four an hour to two. Asking for 96 runs a day was returning about
    # four -- GitHub deprioritises heavily-scheduled workflows, so the open question
    # is whether the cap is absolute or a function of how often we ask. If delivery
    # holds at ~4/day on half the requests the cap is absolute and this changes
    # nothing; if it climbs, asking less often is worth more than asking more.
    - cron: "7,37 * * * *"
  push:
    branches: [main]         # rebuild immediately when you edit pinned.json or config.json
  workflow_dispatch: {}      # "Run workflow" button for manual refresh

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build site
        run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
