name: Build & deploy headlines

on:
  schedule:
    # Not */15: that fires at :00, :15, :30 and :45, the four busiest minutes on
    # GitHub, where scheduled runs get queued behind everyone else's and dropped.
    # Odd minutes are far less contended. Scheduled runs are best-effort either
    # way, so the page shows its real build time rather than a promise.
    - cron: "7,22,37,52 * * * *"
  push:
    branches: [main]         # rebuild immediately when you edit pinned.json or config.json
  workflow_dispatch: {}      # "Run workflow" button for manual refresh

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build site
        run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
